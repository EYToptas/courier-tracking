spring:
  application:
    name: courier-tracking

  datasource:
    url: jdbc:postgresql://localhost:5433/courier_tracking
    username: courier
    password: courier123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: courier-tracking-group
      auto-offset-reset: earliest

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always