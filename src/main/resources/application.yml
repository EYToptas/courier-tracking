spring:
  application:
    name: courier-tracking

  datasource:
    url: jdbc:postgresql://localhost:5433/courier_tracking
    username: courier
    password: courier123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: courier-tracking-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.couriertracking.kafka"
        spring.json.value.default.type: com.couriertracking.kafka.CourierLocationMessage

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always